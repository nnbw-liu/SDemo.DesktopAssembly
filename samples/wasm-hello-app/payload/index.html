<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wasm Hello</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa; --fg: #1b1d22; --muted: #6b7280; --line: #e3e6ec; --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d2028; --fg: #e8e8f0; --muted: #9a9aaa; --line: #333843; --accent: #60a5fa; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 13px/1.5 "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif; user-select: none; }
    .wrap { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; padding: 16px; gap: 12px; }
    .head { display: flex; align-items: baseline; justify-content: space-between; }
    .title { font-size: 15px; font-weight: 600; letter-spacing: .2px; }
    .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
    .clock { font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 600; letter-spacing: 1px; }
    .greeting { color: var(--muted); }
    .spacer { flex: 1; }
    .row { display: flex; gap: 8px; }
    button {
      flex: 1; border: 1px solid var(--line); background: transparent; color: var(--fg);
      border-radius: 8px; padding: 9px 10px; font: inherit; cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:active { transform: translateY(1px); }
    .foot { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <span class="title">Wasm Hello</span>
      <span class="badge">renderer=wasm</span>
    </div>
    <div class="clock" id="clock">--:--:--</div>
    <div class="greeting" id="greeting">你好</div>
    <div class="spacer"></div>
    <div class="row">
      <button id="wave" type="button">点我打招呼</button>
      <button id="reset" type="button">重置计数</button>
    </div>
    <div class="foot">
      <span id="count">点击 0 次</span>
      <span>宿主负责窗口与布局</span>
    </div>
  </div>
  <script>
    const clock = document.getElementById('clock');
    const count = document.getElementById('count');
    const greet = document.getElementById('greeting');
    let clicks = 0;

    function tick() {
      const now = new Date();
      const two = (n) => String(n).padStart(2, '0');
      clock.textContent = two(now.getHours()) + ':' + two(now.getMinutes()) + ':' + two(now.getSeconds());
    }
    setInterval(tick, 1000);
    tick();

    document.getElementById('wave').addEventListener('click', () => {
      clicks += 1;
      count.textContent = '点击 ' + clicks + ' 次';
      greet.textContent = '你好，宿主！';
    });
    document.getElementById('reset').addEventListener('click', () => {
      clicks = 0;
      count.textContent = '点击 0 次';
      greet.textContent = '你好';
    });
  </script>
</body>
</html>
